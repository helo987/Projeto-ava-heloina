{% extends "base.html" %}
{% block title %}Editar pesagem{% endblock %}
{% block content %}
<section class="card">
    <h1>Editar pesagem #{{ romaneio.id }}</h1>
    <form method="post" class="form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div><label>Identificação do animal</label><input name="identificacao_animal" value="{{ romaneio.identificacao_animal }}" maxlength="50" required></div>
        <div><label>Raça</label><input name="raca" value="{{ romaneio.raca }}" maxlength="50" required></div>
        <div><label>Peso (kg)</label><input type="number" name="peso_kg" value="{{ romaneio.peso_kg }}" min="0.01" max="2000" step="0.01" required></div>
        <div><label>Data da pesagem</label><input type="date" name="data_pesagem" value="{{ romaneio.data_pesagem.isoformat() }}" required></div>
        <div class="full"><label>Observações</label><textarea name="observacoes" maxlength="300">{{ romaneio.observacoes or '' }}</textarea></div>
        <div class="full"><button type="submit">Salvar alterações</button></div>
    </form>
</section>
{% endblock %}
